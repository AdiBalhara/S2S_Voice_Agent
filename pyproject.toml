[project]
name = "trijo-tech-voice-s2s"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "google-adk>=2.11.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "lxml>=6.1.3",
    "psycopg>=3.3.6",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "supabase>=2.32.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
trijo-tech-voice-s2s = "trijo_tech_voice_s2s:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pyright]
extraPaths = ["."]

